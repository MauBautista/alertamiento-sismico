# E2E · Dictamen firmado → reingreso liberado (occupant).
#
# PRECONDICIÓN: incidente con dictamen HABITABLE FIRMADO.
#     make cloud-staging-incident PHASE=reset
#     make cloud-staging-incident PHASE=crisis     # deja al ocupante BLOQUEADO
#     make cloud-staging-incident PHASE=reentry    # firma el dictamen
#
# ⚠️ [T-7.63] NO HACE FALTA QUE NADIE FIRME EN LA CONSOLA, y aquí decía que sí.
# `reentry.sql` inserta el dictamen **ya firmado** (`signed_by` no nulo, estado
# `inhabit_monitor`), así que la precondición es una orden de `make`, no una
# persona. Se planificó una tanda de diez contando con diez firmas manuales;
# ninguna hacía falta. Un comentario falso en un documento ejecutable no rompe el
# flujo: rompe la planificación de quien lo lee.
#
# ⚠️ Y el RESET no es ceremonia: sin él, el dictamen de la vuelta anterior sigue
# dentro de la ventana de `reentry_declare_s` (8 h) y la app vería el banner sin
# que esta corrida haya probado nada — un falso verde. Lo arregló `T-7.62`, que
# hizo que `reset` retrodate también los incidentes que `D-33` ya cerró.
#
# ⚠️ POR QUÉ LA ESPERA ES DE 60 s: sembrando por SQL **no se dispara el push**
# —eso lo hace la consola al firmar— así que la app levanta `reentry_approved` en
# su siguiente sondeo de `mobile-state`. El propio sembrador lo dice al correr.
#
# NO PIDE TOTP: entra por el pool de OCUPANTES, cuyo MFA es opcional. Una tanda
# de este flujo no necesita a nadie delante.
appId: com.takab.ailert
---
- launchApp:
    clearState: true
- runFlow: shared/login-occupant.yaml
# `clearState` borra TAMBIÉN el enrolamiento, así que sin esto la app se queda en
# el asistente de configuración y Home no llega a pintarse nunca: la aserción de
# abajo falla por una razón que no tiene nada que ver con el dictamen. Los otros
# flujos que limpian estado ya lo hacían; este no, y era el segundo motivo por el
# que nunca se acreditó.
- runFlow: shared/enrolar-sitio.yaml

# El occupant estaba en bloqueo de reingreso (1.5); al firmarse el dictamen
# habitable, mobile-state pasa a reentry_approved y Home lo declara.
# `extendedWaitUntil` y no `assertVisible: {timeout:}` — ese `timeout` NO existe
# en `assertVisible` y Maestro rechaza el fichero ENTERO con «Unknown Property:
# timeout» antes de ejecutar un solo paso. Por eso este flujo llevaba desde que
# se escribió sin acreditarse: no fallaba una aserción, es que nunca cargó.
- extendedWaitUntil:
    visible:
      id: "reentry-banner"
    timeout: 60000        # espera el push + re-lectura de mobile-state
- assertVisible:
    text: ".*REINGRESO AUTORIZADO.*"
