# E2E · Táctico: cámara forense → formulario de daños → llega a Triage.
#
# PRECONDICIÓN: la sacudida CONCLUIDA, no un incidente «activo» a secas.
#     make cloud-staging-incident PHASE=crisis
#     make cloud-staging-incident PHASE=conclude
#
# ⚠️ [T-7.63] Aquí decía «incidente ACTIVO» y es impreciso de la forma que cuesta
# una corrida: con la fase en `crisis` el brigadista **no ve las pestañas**, ve la
# instrucción de crisis a pantalla completa, y el flujo muere en `Tap on TRIAGE`
# por una razón que no tiene nada que ver con la cámara.
#
# PIDE TOTP: entra por el pool PRINCIPAL, con MFA obligatorio. Cada corrida pide
# un código nuevo —`run.sh` cierra la sesión de Cognito antes de cada flujo
# (`T-7.56`)— y Maestro no lo genera: hace falta una persona delante.
appId: com.takab.ailert
---
- launchApp:
    clearState: true
- runFlow: shared/login-tactico.yaml
# Tras una sacudida concluida, el check-in de vida TOMA la pantalla y tapa las
# pestañas. Responderlo primero es la secuencia real, no un rodeo.
- runFlow: shared/atender-checkin.yaml
# El onboarding va DESPUÉS: con un incidente abierto, el vigilante monta la toma
# de check-in ENCIMA del onboarding, así que antes no es siquiera visible.
- runFlow: shared/onboarding-tactico.yaml
# [T-7.57] Y aquí se ESPERA a que el armazón esté montado, atendiendo lo que
# salga. La segunda vuelta al par que puso `T-7.56` subía la tasa de acierto pero
# no la cerraba: las tomas se destapan una a otra y aparecen cuando el estado
# termina de llegar. El subflujo espera sobre un ancla en vez de mirar más veces.
- runFlow: shared/esperar-pestanas-tacticas.yaml


# 2.4 · Formulario de daños con foto forense (2.3).
- tapOn: "TRIAGE"
- assertVisible: "REPORTE RÁPIDO DE DAÑOS"
- tapOn:
    id: "cat-people_trapped"
- assertVisible:
    text: ".*PERSONAS EN RIESGO · PRIORIDAD MÁXIMA.*"
- tapOn: "CÁMARA FORENSE"
# Cámara: capturar y usar (la marca de agua se hornea en el pixel).
- tapOn: "CAPTURAR"
# ⚠️ [T-7.57] Dejar que el obturador TERMINE antes de confirmar. Medido el
# 2026-09-19: los tres toques de la cámara completaban y la foto no se contaba
# —ni esperando 20 s a la cuenta—, porque «USAR ESTA FOTO» se tocaba mientras la
# captura seguía en curso y se descartaba. El problema no era la espera del
# final: era tocar demasiado pronto.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "USAR ESTA FOTO"
# ⚠️ [T-7.57] Se ESPERA, no se afirma al instante. La marca de agua «se hornea en
# el pixel» (lo dice el comentario de arriba), y eso tarda: medido el 2026-09-19,
# los tres toques de la cámara completaban y esta aserción fallaba a continuación
# porque la foto todavía no estaba contada. Un `assertVisible` aquí es una carrera
# contra el procesado de una imagen.
- extendedWaitUntil:
    visible:
      text: ".*1 foto\\(s\\).*"
    timeout: 20000
- tapOn: "ENVIAR REPORTE"
# La verificación de que aparece en Triage de la consola con hash verificado
# se hace en la web (StructuralTriage) durante la corrida de aceptación.
