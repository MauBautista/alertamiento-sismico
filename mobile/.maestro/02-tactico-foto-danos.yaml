# E2E · Táctico: cámara forense → formulario de daños → llega a Triage.
# Precondición: incidente ACTIVO; el táctico enrolado con dictamen_read/damage.
appId: com.takab.ailert
---
- launchApp:
    clearState: true
- runFlow: shared/login-tactico.yaml
# Tras una sacudida concluida, el check-in de vida TOMA la pantalla y tapa las
# pestañas. Responderlo primero es la secuencia real, no un rodeo.
- runFlow: shared/atender-checkin.yaml
# El onboarding va DESPUÉS: con un incidente abierto, el vigilante monta la toma
# de check-in ENCIMA del onboarding, así que antes no es siquiera visible.
- runFlow: shared/onboarding-tactico.yaml
# ⚠️ [T-7.56] SEGUNDA VUELTA AL PAR, y no es redundancia.
#
# Las dos tomas de pantalla —el check-in de vida y el asistente de configuración—
# aparecen cuando el estado del servidor termina de cargar, que es DESPUÉS de que
# los subflujos de arriba comprueben su visibilidad AL INSTANTE. Y se destapan
# una a otra: atender el check-in deja el asistente delante.
#
# Medido el 2026-09-19 con un incidente recién abierto: primera vuelta, ninguna
# visible, las dos se saltan; aparece el check-in y tapa las pestañas. Se
# responde, y entonces aparece el asistente. El flujo moría con un «no encuentro
# LISTA» que apunta a la app en vez de a la carrera.
#
# Las dos son condicionales: en una corrida sana no hacen nada y no cambian el
# camino. Repetir el PAR es lo que cubre el destape mutuo.
- runFlow: shared/atender-checkin.yaml
- runFlow: shared/onboarding-tactico.yaml


# 2.4 · Formulario de daños con foto forense (2.3).
- tapOn: "TRIAGE"
- assertVisible: "REPORTE RÁPIDO DE DAÑOS"
- tapOn:
    id: "cat-people_trapped"
- assertVisible:
    text: ".*PERSONAS EN RIESGO · PRIORIDAD MÁXIMA.*"
- tapOn: "CÁMARA FORENSE"
# Cámara: capturar y usar (la marca de agua se hornea en el pixel).
- tapOn: "CAPTURAR"
- tapOn: "USAR ESTA FOTO"
- assertVisible:
    text: ".*1 foto\\(s\\).*"
- tapOn: "ENVIAR REPORTE"
# La verificación de que aparece en Triage de la consola con hash verificado
# se hace en la web (StructuralTriage) durante la corrida de aceptación.
