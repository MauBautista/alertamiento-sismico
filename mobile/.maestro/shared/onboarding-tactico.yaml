# Subflujo · onboarding del TÁCTICO tras `clearState`.
#
# Es hermano de `enrolar-sitio.yaml` y se separa por una razón de fondo: el
# táctico NO se vincula con un código. Su alcance sale de `custom:site_scope` en
# el token (el occupant es el que lo tiene default-deny y se enrola, R2). Meterle
# el `SITE_CODE` del occupant sería consumir un código que no es suyo.
#
# Cada paso va condicionado: si ya pasó el onboarding, no hace nada.
#
# «Continuar sin vincular» no es una puerta trasera: es la salida que T-2.79.c
# añadió con su consecuencia escrita en pantalla, y para el táctico es el camino
# correcto, no el atajo.
appId: com.takab.ailert
---
# ⚠️ [T-7.57] LOS TRES TOQUES SON `optional`, y no es dejadez.
#
# La comprobación del `when` y el toque **no son atómicos**: medido el 2026-09-19,
# la condición dio verdadero y un instante después la pantalla ya había pasado a
# otra cosa, así que el toque fallaba y se llevaba la corrida entera. Pasó en este
# subflujo con «Continuar» y en `atender-checkin` con «ESTOY BIEN»: es el mismo
# defecto, y por eso se arreglan igual.
#
# Este subflujo se llama desde un BUCLE de reintento (`esperar-pestanas-tacticas`),
# así que un toque que llega tarde es ruido: la vuelta siguiente vuelve a mirar.
# Lo que NO es opcional es el RESULTADO — si el asistente se queda sin atender, el
# ancla `tabs-tacticas` no aparece y el flujo falla diciéndolo.
- runFlow:
    when:
      visible: "CONFIGURACIÓN · PASO 1 DE 3"
    commands:
      - tapOn:
          text: "Continuar"
          optional: true

- runFlow:
    when:
      visible:
        id: "privacy-accept"
    commands:
      - tapOn:
          id: "privacy-accept"
          optional: true

- runFlow:
    when:
      visible:
        id: "enrolamiento-continuar-sin-vincular"
    commands:
      - tapOn:
          id: "enrolamiento-continuar-sin-vincular"
          optional: true
