[project]
name = "takab-api"
version = "0.1.0"
description = "TAKAB API — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "boto3>=1.43.41",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.9",
    # [T-2.09] Verificación de firmas de INTENCIÓN (device_keys, EC/RSA).
    # Ya venía por pyjwt[crypto]; se declara directa porque commands/intent.py
    # la importa a nivel de módulo.
    "cryptography>=43",
    "fpdf2>=2.8.7",
    # [T-2.41] SOLO para la FFT del dictamen técnico. Se rechazó ObsPy —que sería la
    # opción obvia para leer miniSEED— porque arrastra matplotlib+scipy+lxml (>200 MB)
    # a una imagen co-locada con TimescaleDB en un EC2 pequeño; el lector STEIM2 vive
    # en `dictamen/mseed.py` y se valida contra vectores del propio ObsPy del edge.
    "numpy>=2.1",
    # RUNTIME, no dev: `notify/providers.py` lo importa a nivel de módulo para el canal
    # webhook. Estaba solo en el extra `dev`, así que el worker `notify` moría al
    # arrancar en cualquier despliegue real (descubierto ejecutando la imagen, T-1.37).
    "httpx>=0.27",
    # [T-7.22] RUNTIME. Llega transitiva por `fpdf2` (`Pillow!=9.2.*,>=8.3.2`), así
    # que hoy ya está en la imagen — pero `documentos/fotos.py` la importa a nivel
    # de módulo para redimensionar las fotos del brigadista y para QUITARLES el
    # EXIF, y una dependencia que sólo existe porque otra la arrastra desaparece
    # el día que aquélla cambie de motor. Es el mismo razonamiento de `httpx` dos
    # líneas arriba, que costó un despliegue.
    "pillow>=11",
    # [T-7.21] RUNTIME, y por la MISMA razón que las dos de arriba: llega
    # transitiva por `fpdf2`, pero `documentos/hoja.py` la importa para medir la
    # tipografía real al envolver el texto del SVG de la hoja membretada. Una
    # dependencia que sólo existe porque otra la arrastra desaparece el día que
    # aquélla cambie de motor — y aquí la consecuencia sería silenciosa: sin
    # fontTools se mide con el avance declarado de respaldo y el papel sale con
    # los renglones partidos donde no toca, sin que nada falle.
    "fonttools>=4.50",
]

[project.optional-dependencies]
# Instalación canónica de dev: `pip install -e ".[dev]"` (Makefile y CI).
# Mantener en espejo con [dependency-groups] dev (pip NO instala grupos PEP 735).
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "moto[s3,sqs,ses]>=5.2.2",
    "pytest-asyncio>=1.4.0",
    # [T-7.21] Leer el PDF que producimos, para comprobar que el membrete sale
    # como TEXTO extraíble y no sólo dibujado. La ficha decía `pdftotext`, que es
    # poppler: sería la PRIMERA dependencia de un binario del sistema en la suite
    # —CI hace `pip install -e ".[dev]"` y nada más—. `pypdf` es un paquete
    # Python, lo pide ya el Goal de F4 para contar imágenes, y resuelve el
    # `/ToUnicode` de las DejaVu embebidas, que es justo lo que un lector
    # escrito a mano tendría que reimplementar. Sólo en dev: no entra en la imagen.
    "pypdf>=5.1",
]

[tool.setuptools.package-data]
# [T-2.41] Tipografía Unicode del PDF. Las fuentes core de fpdf2 son latin-1 y
# degradaban Δ, ≥ y ≈ a interrogantes en un documento de compliance.
# [T-7.21] El arte y la tipografía se mudaron con el chasis a `documentos/`:
# los usa el membrete, que ahora comparten el dictamen, el reporte de simulacro
# y el informe del evento.
"takab_api.documentos" = ["fonts/*.ttf", "fonts/LICENSE", "marca/*.png"]
# [T-2.77] Los artefactos de plantilla de WhatsApp. Sin esta línea el wheel sale
# sin ellos y el canal se declara simulado en producción "sin motivo": el catálogo
# estaría vacío porque el directorio no viajó, no porque Meta no haya aprobado.
"takab_api.notify" = ["whatsapp_templates/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
# ../demo/tests (T-1.47): la guardia anti-TRUNCATE-remoto de la demo corre con la
# suite del api — vive fuera porque demo/ no es un paquete instalable.
testpaths = ["tests", "../demo/tests"]
asyncio_mode = "auto"
markers = [
    "perf: pruebas de rendimiento (p95/EXPLAIN). Excluidas de la suite normal (skip salvo TAKAB_RUN_PERF=1); correr con `-m perf` contra una DB dedicada sembrada.",
]

# Espejo del extra dev para flujos uv (`uv sync` instala este grupo, no el extra).
[dependency-groups]
dev = [
    "moto[s3,sqs,ses]>=5.2.2",
    "pytest-asyncio>=1.4.0",
    "pypdf>=5.1",
]
