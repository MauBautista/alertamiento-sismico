name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs superseded del mismo ref (ahorra minutos de CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        # Misma imagen que docker-compose y el EC2 dev (TimescaleDB + PostGIS);
        # la suite exige DB viva (el conftest aplica `alembic upgrade head`).
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: takab
          POSTGRES_PASSWORD: takab_dev
          POSTGRES_DB: takab
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U takab -d takab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://takab:takab_dev@127.0.0.1:5433/takab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Formato (ruff)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest -q -m "not perf"
      - name: Tests de la demo (spool + guardas de reset)
        # B-2: el sustituto de IoT Core/SQS de la demo es parte del contrato de
        # acreditación; sus imports (takab_api + psycopg) viven en este venv.
        run: pytest -q ../demo/tests
      - name: Drift gate · OpenAPI (sdk-ts)
        # El contrato volcado debe coincidir con el commiteado. Si cambia la API
        # sin regenerar shared/sdk-ts/openapi.json, esto falla.
        run: |
          python scripts/export_openapi.py
          git -C .. diff --exit-code shared/sdk-ts/openapi.json

  sdk:
    name: sdk-ts · generate + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared/sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shared/sdk-ts/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Generar cliente (openapi-ts)
        run: npm run generate
      - name: Drift gate · src/gen
        # El cliente generado debe coincidir con el commiteado (contrato → tipos).
        run: git -C ../.. diff --exit-code shared/sdk-ts/src/gen
      - name: Typecheck (tsc)
        run: npm run check

  web:
    name: web · eslint + prettier + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            shared/sdk-ts/package-lock.json
      # Gate de drift de design-tokens: `css/tokens.css` se GENERA de `tokens.json`
      # (salida determinista, comparación byte a byte). Sin este paso, la consola y
      # la app móvil pueden pintar colores distintos sin que nada lo detecte — el
      # gate existía desde T-2.01 pero no lo invocaba nadie. Sin dependencias: node puro.
      - name: Drift gate · design-tokens
        run: npm run check
        working-directory: shared/design-tokens
      # @takab/sdk entra como symlink file: → sus deps de runtime
      # (@hey-api/client-fetch) resuelven por realpath contra
      # shared/sdk-ts/node_modules, que debe estar poblado.
      - name: Instalar dependencias (sdk)
        run: npm ci
        working-directory: shared/sdk-ts
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Formato (prettier)
        run: npm run format:check
      - name: Tests (vitest)
        run: npm run test -- --run
      - name: Build (tsc + vite)
        run: npm run build

  edge:
    name: edge · ruff + pytest (sin hardware)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    env:
      # Sin GPIO físico en CI: gpiozero usa la MockFactory (blueprint §4.4).
      GPIOZERO_PIN_FACTORY: mock
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: edge/uv.lock
      - name: Sincronizar entorno (Python 3.12 + deps + grupo dev)
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Formato (ruff)
        run: uv run ruff format --check .
      - name: Node presente (el arnés del panel se salta sin él)
        # `test_local_api_panel.py` renderiza el panel REAL del gabinete
        # ejecutando su <script> con Node, y lleva un `skipif` cuando `node` no
        # está en el PATH. Sin esta comprobación, un runner sin Node saltaría 67
        # tests EN SILENCIO y el job seguiría verde cubriendo nada — la misma
        # familia de fallo que la alarma que vigila la AUSENCIA del latido.
        # `ubuntu-latest` trae Node hoy; el día que deje de traerlo, que grite.
        run: node --version
      - name: Tests (pytest)
        # `-rs`: los tests que exigen hardware se saltan en CI, y sin este flag se
        # saltaban ANÓNIMOS — un "N skipped" no dice QUÉ dejó de cubrirse. Con `-rs`
        # cada skip sale con su nombre y su razón en el log, que es lo que hace
        # auditable la cobertura real del job.
        run: uv run pytest -q -rs

  licenses:
    name: licenses · cero AGPL/GPL en el árbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "*/uv.lock"
      # Los DOS entornos, porque cada uno tiene su lock y un prohibido puede entrar en
      # uno sin tocar el otro. Vigilar solo `api/` dejaría sin cubrir al gabinete, que es
      # justamente donde vive el CCTV.
      - name: Sincronizar api
        run: uv sync --directory api
      - name: Sincronizar edge
        run: uv sync --directory edge
      - name: Guarda de licencias (D-24)
        run: ./ci/check-licenses.sh
      - name: Archivar los avisos de terceros
        # Se GENERA en cada build y no se commitea: un inventario de licencias escrito a
        # mano envejece en silencio. Se archiva como artefacto para poder acompañar una
        # entrega sin tener que reconstruirlo a posteriori.
        uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.txt

  mobile:
    name: mobile · eslint + tsc + jest + bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Expo SDK 57 / RN 0.86 piden Node moderno; 22 = LTS activo.
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            shared/sdk-ts/package-lock.json
      # @takab/sdk y @takab/design-tokens entran como symlink file: (mismo
      # patrón que web): las deps de runtime del sdk resuelven por realpath
      # contra shared/sdk-ts/node_modules. design-tokens no tiene deps.
      - name: Instalar dependencias (sdk)
        run: npm ci
        working-directory: shared/sdk-ts
      - name: Instalar dependencias
        run: npm ci
      # [T-2.125] `npm run lint`, NO `npx expo lint` a pelo. El CLI de Expo linta
      # sólo `src`, `app` y `components` — está a fuego en su `DEFAULT_INPUTS` y no
      # lee ninguna clave de configuración—, así que invocarlo sin ruta dejaba fuera
      # 21 ficheros lintables de este árbol, `mobile/tests/**` incluido. El script de
      # npm pasa `.` y cubre el paquete entero. Un gate que parece cubrir más de lo
      # que cubre es la misma familia que T-2.58/T-2.59 y T-2.124.
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Tests (jest)
        run: npm test
      # El gate que faltaba. jest, tsc y eslint pueden estar los tres en verde
      # con una app QUE NO ARRANCA: `expo-router` construye su tabla de rutas con
      # un `require.context` sobre `src/app`, así que cualquier fichero que caiga
      # ahí entra en el bundle. El 2026-08-08 entraron tres `*.test.tsx`, que
      # arrastraron `@testing-library/react-native` → `console` de Node, y el
      # bundle dejó de construirse. Nadie lo vio hasta que se compiló un APK un
      # día después, porque nada en el proyecto construía la app: web tiene su
      # `vite build` y móvil no tenía equivalente. Esto lo es.
      - name: Bundle (expo export)
        run: npx expo export --platform android --output-dir /tmp/expo-export

  landing:
    name: landing · eslint + prettier + astro check + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Formato (prettier)
        run: npm run format:check
      - name: Typecheck (astro check)
        run: npm run typecheck
      # La suite construye dist/ y afirma sobre el ARTEFACTO: cadenas
      # obligatorias (deslinde SASMEX + dominio remitente — el sitio es
      # evidencia del caso SES), cadenas prohibidas (cifras/normas, decisión
      # 2026-08-25), cero orígenes externos, y presupuestos de tamaño
      # deterministas (JS<20KB gz). Lighthouse NO corre aquí: LCP en runners
      # compartidos es la clase de flake que e2e.yml prohíbe convertir en gate;
      # vive en `make landing-audit` (local) y landing-audit.yml (manual).
      - name: Tests (contenido + presupuestos sobre dist)
        run: npm run test
      - name: Build (astro)
        run: npm run build

  # [T-2.86.c · hueco RO-6.a] La regla de oro 6 ("nada de secretos hardcodeados")
  # era la ÚNICA de las once sin un solo test, paso de CI ni pre-commit: se
  # sostenía en que nadie se olvidara. Va en su PROPIO job, no como un paso más
  # del job `infra`, por dos razones: aparece con nombre propio en la lista de
  # checks del PR (que es lo que se marca como required en la protección de rama)
  # y no se queda esperando a que terraform descargue providers. Sin dependencias:
  # git + el python3 del runner, cero red.
  secretos:
    name: secretos · barrido de la regla de oro 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Barrido de secretos (árbol completo + batería de mutaciones)
        run: bash infra/scripts/tests/test_secret_scan.sh

  infra:
    name: infra · terraform fmt + validate + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
      - name: Formato (terraform fmt)
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate bootstrap
        run: terraform -chdir=infra/terraform/bootstrap init -backend=false && terraform -chdir=infra/terraform/bootstrap validate
      - name: Validate envs/dev
        run: terraform -chdir=infra/terraform/envs/dev init -backend=false && terraform -chdir=infra/terraform/envs/dev validate
      # `validate` NO mira la semántica: una alarma con el `treat_missing_data` equivocado
      # pasa fmt y validate y aun así miente en producción. Estos tests son plan-only
      # (credenciales falsas, sin red) y por eso el job sigue siendo hermético.
      - name: Test de semántica de alarmas (plan-only, sin AWS)
        run: terraform -chdir=infra/terraform/modules/observability init -backend=false && terraform -chdir=infra/terraform/modules/observability test
      # [T-2.71] La otra mitad del silenciador de alarmas. Las mute rules son
      # objetos AWS efímeros creados por API, así que terraform no puede asertar
      # sobre ELLAS — pero sí sobre el permiso que las hace posibles. Este test
      # falla si la política IAM concede `PutAlarmMuteRule` sobre alguna de las
      # tres alarmas intocables (`dlq_depth`, `iot_rule_errors`, `ghost_gateways`).
      - name: Test del alcance IAM del silenciador (plan-only, sin AWS)
        run: terraform -chdir=infra/terraform/modules/database init -backend=false && terraform -chdir=infra/terraform/modules/database test
      # [T-2.72] La retención de los respaldos. `Expiration` sobre un bucket
      # VERSIONADO no borra un byte: pone un delete marker y la versión anterior
      # se queda facturándose para siempre. Peor para el PITR — el delete marker
      # esconde el objeto al restaurador. Este módulo vivió desde julio sin un
      # solo test, así que la corrección se podía borrar entera y CI seguía verde.
      - name: Test de la retención de respaldos (plan-only, sin AWS)
        run: terraform -chdir=infra/terraform/modules/storage init -backend=false && terraform -chdir=infra/terraform/modules/storage test
      # [T-2.84.b] El pool que exige el segundo factor. La regla de oro 8 pide MFA
      # "sin excepción" sobre la superficie que abre válvulas de gas, y el ID token
      # de Cognito NO lleva `amr` ni `acr` (son claims reservados que ni un Lambda
      # propio puede poner), así que lo único que la API puede exigir es la
      # PROCEDENCIA del token. Eso convierte la configuración del pool en la mitad
      # del control — y `identity` era el único de los cuatro módulos sin test: una
      # deriva a OPTIONAL no la veía nadie. Este paso corre porque, sin él, la
      # matriz acreditaría el .tftest.hcl como cobertura bloqueante mientras CI
      # jamás lo invoca: el falso verde de T-2.63, otra vez.
      - name: Test del pool que exige el segundo factor (plan-only, sin AWS)
        run: terraform -chdir=infra/terraform/modules/identity init -backend=false && terraform -chdir=infra/terraform/modules/identity test
      # Re-aprovisionar un gabinete NO puede borrarle la configuración. Sin este test
      # el único aviso sería un gabinete real quedándose sin sensor.
      - name: Test de fusión del edge.env (provisión no destructiva)
        run: bash infra/scripts/tests/test_merge_env.sh
      # Paridad local↔CI (T-2.62): cada paso de calidad de ESTE fichero tiene que
      # poder correrse con `make`. Corre aquí y no sólo en `make test` porque `make
      # test` no lo ejecuta nadie en CI: si el gate viviera sólo en local, un PR
      # podría romper la paridad y CI no se enteraría — el mismo agujero que la
      # tarea cierra, reintroducido en el propio vigilante. Sin dependencias:
      # bash + python3 del runner.
      - name: Test de paridad local ↔ CI (make cubre lo que exige el CI)
        run: bash infra/scripts/tests/test_ci_parity.sh
      # TODO: paso opcional de plan-only con el rol OIDC takab-ci-plan (requiere
      # permissions: id-token: write). Se deja fuera para mantener el CI de PRs
      # hermético; ver infra/terraform/README.md.
