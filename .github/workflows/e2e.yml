name: E2E (matriz de viewports)

# [T-2.56] MANUAL Y NO BLOQUEANTE, a propósito.
#
# Estos specs no prueban componentes: prueban el SISTEMA (DB sembrada + API con
# /dev/token + worker + vite). Un job así tiene una tasa de fallo intermitente
# que no viene del código sino de arrancar cuatro procesos en un runner
# compartido. Convertirlo en gate de merge enseña a la gente a re-lanzar CI
# hasta que pase, que es peor que no tenerlo: entrena a ignorar el rojo.
#
# Por eso: `workflow_dispatch` (se lanza cuando alguien quiere el dato, p. ej.
# antes del redespliegue de T-2.57) y `continue-on-error` en el paso que corre
# la matriz. El reporte HTML queda como artefacto SIEMPRE, que es el valor real:
# capturas y traza de los tres viewports para mirarlas.
#
# El gate de verdad de este trabajo son los contract-tests de vitest
# (`layoutInvariants` y `cssContract`), que sí corren en cada PR y no dependen
# de levantar nada.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Viewport concreto (vacío = los tres)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - laptop-1280x800
          - laptop-1440x900
          - videowall-1920x1080

permissions:
  contents: read

jobs:
  e2e:
    name: web · playwright 1280×800 / 1440×900 / 1920×1080
    runs-on: ubuntu-latest
    services:
      db:
        # Misma imagen que el job `api` y que el EC2 dev.
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: takab
          POSTGRES_PASSWORD: takab_dev
          POSTGRES_DB: takab
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U takab -d takab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://takab:takab_dev@127.0.0.1:5433/takab
      PW_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            shared/sdk-ts/package-lock.json

      - name: Instalar dependencias (api)
        run: python -m pip install -e ".[dev]"
        working-directory: api
      - name: Instalar dependencias (sdk)
        run: npm ci
        working-directory: shared/sdk-ts
      - name: Instalar dependencias (web)
        run: npm ci
        working-directory: web
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      # `make soc-local` levanta el stack completo (DB sembrada + API + worker +
      # vite) y es EL MISMO comando del runbook local: si diverge, el e2e deja de
      # representar lo que la gente prueba a mano.
      - name: Levantar el stack local
        run: make soc-local &
      - name: Esperar a la consola
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then echo "consola arriba"; exit 0; fi
            sleep 5
          done
          echo "la consola no respondió en 5 min"; exit 1

      - name: Playwright (matriz de viewports)
        id: pw
        continue-on-error: true
        working-directory: web
        run: |
          if [ -n "${{ inputs.project }}" ]; then
            npx playwright test --project "${{ inputs.project }}"
          else
            npx playwright test
          fi

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

      - name: Resultado (informativo, no bloquea)
        if: always()
        run: |
          echo "playwright: ${{ steps.pw.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "El reporte HTML está en el artefacto \`playwright-report\`." >> "$GITHUB_STEP_SUMMARY"
