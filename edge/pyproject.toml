[project]
name = "takab-edge"
version = "0.1.0"
description = "TAKAB Ailert — gateway de inteligencia del gabinete (Raspberry Pi 5)"
requires-python = ">=3.12"
# Núcleo instalable sin hardware (CI x86-64 y Raspberry Pi 5 ARM64). Los backends
# que exigen hardware físico van en extras (ver [project.optional-dependencies]).
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "obspy>=1.4",         # SeedLink + miniSEED (blueprint §4.3); base del simulador RS4D
    "gpiozero>=2.0",      # GPIO WR-1 + relés; MockFactory permite dev/CI sin hardware
    "paho-mqtt>=2.1",     # conector MQTT hacia AWS IoT Core (T-1.11)
]

[project.optional-dependencies]
# Backends de hardware — SOLO en el Raspberry Pi 5 real (no en CI). Ver T-1.3/T-1.9.
hardware = [
    "lgpio>=0.2",         # backend GPIO nativo del Pi 5 (BCM2712)
]
# Driver BACnet/IP real — activable por contrato (T-1.9). El simulador NO lo necesita.
bacnet = [
    "bacpypes3>=0.0.98",
]
# Transporte real hacia AWS IoT Core (T-1.11/T-1.17): provee `awscrt`/`awsiot`, que van
# detrás de imports perezosos en `cloud.AwsIotMqttTransport`. paho-mqtt sigue como dep
# del núcleo (no se rompe el lock), pero el transporte de producción es awsiotsdk —
# instalar SOLO en el Pi con `uv sync --extra aws` (no en CI).
aws = [
    "awsiotsdk>=1.22",
]
# [T-2.33] Radio LoRa real (módem ESP32 por USB-serial). El simulador NO lo
# necesita; instalar en el Pi con `uv sync --extra lora` cuando exista hardware.
lora = [
    "pyserial>=3.5",
]
# [T-3.11] Cliente ONVIF del CCTV. Va SOLO en la máquina que corre `takab-cctv`, que
# no tiene por qué ser el gabinete: el proceso está escrito para correr igual en el Pi
# que en una caja aparte del sitio (blueprint §4.8). ffmpeg NO es una dependencia de
# Python — es un binario LGPL invocado por subproceso, y por exigencia de D-24 nunca
# enlazado. El import de `onvif` es perezoso: el núcleo tiene que seguir instalándose
# y pasando CI en x86-64 sin cámara.
cctv = [
    "onvif-zeep>=0.2.12",
]

# Grupo de desarrollo — uv lo instala por defecto en `uv sync`/`uv run` (a diferencia
# de los extras), evitando que `uv run` desinstale herramientas al re-sincronizar.
[dependency-groups]
dev = [
    "boto3>=1.34",
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
takab-edge = "takab_edge.supervisor:main"
takab-gpio = "takab_edge.gpio.__main__:main"  # proceso mínimo del camino de vida (T-1.3)
# [T-2.70.a·D2/P2] Interroga al dueño de los pines desde el shell (solo lectura):
# es lo que `deploy.sh` y el traspaso de propiedad necesitan para decidir.
takab-gpioctl = "takab_edge.pinlink.cli:main"
# [T-3.11] Proceso APARTE del CCTV, con su propia unidad systemd y sus propios límites
# de CPU y memoria (blueprint §4.8/B.3). Esa separación es lo que hace que un OOM del
# decodificador de vídeo mate a este proceso y a nadie más.
takab-cctv = "takab_edge.cctv.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["takab_edge", "simulators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# El simulador de sismo puede ser lento; los tests unitarios usan trazas cortas.
filterwarnings = ["ignore::DeprecationWarning"]
